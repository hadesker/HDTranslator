<head>

<body style="width: 500px">
<div class="container-fluid my-3">
    <div class="row">
        <div class="col-12">
            <div id="parent" class="form-group">
                <div class="input-group">
                    <input type="text" autocapitalize="none" value="" autofocus="" class="form-control ui-autocomplete-input" placeholder="Start with '.ve.' or '.ev.' to translate a sentence" id="word" autocomplete="off">
                    <div class="input-group-append">
                        <button class="btn btn-outline-success btn-search" type="button"><i class="fa fa-search"></i></button>
                        <button class="btn btn-outline-info btn-paste" type="button"><i class="fa fa-paste"></i></button>
                        <button class="btn btn-outline-warning btn-clear" type="button"><i class="fa fa-remove"></i></button>
                        <button class="btn btn-outline-dark btn-auto-translation" type="button">
                            <input type="checkbox"  title="Auto translation when text is selected" class="form-control">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-md-6 mb-3">
            <div class="row">
                <div class="col-12 mb-3">
                    <div class="card ">
                        <div class="card-header text-white bg-info">
                            Meaning in English-Vietnamese
                        </div>
                        <div class="card-body" id="translate-content">
                            <div class="p-3">The result will be displayed in here...</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 mb-3">
                    <div class="card ">
                        <div class="card-header text-white bg-success">
                            Meaning in English
                        </div>
                        <div class="card-body" id="english-content-1">
                            <div class="p-3">The result will be displayed in here...</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 mb-3">
                    <div class="card ">
                        <div class="card-header text-white bg-dark">
                            Synonyms in English
                        </div>
                        <div class="card-body" id="synonym">
                            <div class="p-3">The result will be displayed in here...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
